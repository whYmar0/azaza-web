<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ project_name|default:"Sudoku Service" }}{% endblock %}</title>
  {% block head %}{% endblock %}
  <!-- Стили — прямо в шаблоне, без статических файлов: при выключенном
       DEBUG (пара 14) runserver статику не отдаёт, а страница должна
       выглядеть одинаково и на ноутбуке, и на сервере. -->
  <style>
    :root {
      --paper: #EEF1F5;
      --sheet: #FFFFFF;
      --ink: #1D2433;
      --graphite: #5B6475;
      --rule: #C9D0DC;
      --pencil: #2F5BD3;
      --pencil-wash: #E6EDFD;
      --run: #A15C07;
      --done: #1F7A48;
      --err: #B42318;
      --err-wash: #FDECEA;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Neue", cursive;
      --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
    a { color: var(--pencil); }
    :focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }

    .top { max-width: 1040px; margin: 0 auto; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 600 20px/1 var(--serif); }
    .brand svg { flex: none; }
    .who { display: flex; align-items: center; gap: 12px; color: var(--graphite); font-size: 15px; }
    .who form { margin: 0; }
    .who strong { color: var(--ink); font-weight: 600; }
    @media (max-width: 560px) { .who-label { display: none; } .top { padding: 16px; } main { padding: 8px 16px 48px; } }

    main { max-width: 1040px; margin: 0 auto; padding: 8px 24px 64px; }
    h1 { font: 600 34px/1.15 var(--serif); margin: 8px 0 6px; letter-spacing: -0.01em; }
    h2 { font: 600 21px/1.25 var(--serif); margin: 0 0 12px; }
    .lead { color: var(--graphite); margin: 0 0 28px; max-width: 60ch; }
    .muted { color: var(--graphite); }

    .layout { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 40px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 28px; } h1 { font-size: 28px; } }

    /* Сетка 9×9 — главный объект страницы. Жирные линии — границы блоков 3×3. */
    .board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); width: 100%; max-width: 480px; aspect-ratio: 1; background: var(--sheet); border: 3px solid var(--ink); }
    .cell { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: clamp(20px, 5vw, 30px); line-height: 1; min-width: 0; }
    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+73) { border-bottom: 0; }
    .cell.re { border-right: 2px solid var(--ink); }
    .cell.be { border-bottom: 2px solid var(--ink); }
    .given { font-family: var(--serif); font-weight: 700; color: var(--ink); }
    .solved { font-family: var(--hand); color: var(--pencil); animation: pencil-in .4s ease-out both; animation-delay: calc(var(--o, 0) * 40ms); }
    @keyframes pencil-in { from { opacity: 0; transform: translateY(3px) scale(.85); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .solved { animation: none; } }

    .legend { display: flex; gap: 20px; margin: 12px 0 0; font-size: 14px; color: var(--graphite); }
    .legend span b { font-size: 18px; margin-right: 6px; }
    .legend .g { font-family: var(--serif); color: var(--ink); }
    .legend .s { font-family: var(--hand); color: var(--pencil); font-weight: 400; }

    .btn { font: 600 15px/1 var(--sans); border-radius: 6px; padding: 11px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
    .btn:hover { background: #2C3650; }
    .btn-quiet { font: 500 14px/1 var(--sans); border-radius: 6px; padding: 8px 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
    .btn-quiet:hover { border-color: var(--graphite); }
    .link-btn { font: inherit; border: 0; background: none; padding: 0; color: var(--pencil); cursor: pointer; text-decoration: underline; }

    .errors { list-style: none; margin: 10px 0 0; padding: 10px 12px; background: var(--err-wash); color: var(--err); border-left: 3px solid var(--err); font-size: 15px; }
    .errors li + li { margin-top: 4px; }

    .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
    .status.queued, .status.running { color: var(--run); }
    .status.running::before, .status.queued::before { animation: pulse 1s ease-in-out infinite alternate; }
    .status.done { color: var(--done); }
    .status.error { color: var(--err); }
    @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .status::before { animation: none !important; } }
  </style>
</head>

<body>
  <header class="top">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1.5" y="1.5" width="23" height="23" fill="#fff" stroke="#1D2433" stroke-width="3" />
        <path d="M9.5 3v20M16.5 3v20M3 9.5h20M3 16.5h20" stroke="#1D2433" stroke-width="1.5" />
        <text x="13" y="16.4" text-anchor="middle" font-size="7" font-family="Georgia, serif" font-weight="700" fill="#2F5BD3">5</text>
      </svg>
      Sudoku Service
    </a>
    {% if user.is_authenticated %}
    <div class="who">
      <span><span class="who-label">Вы вошли как </span><strong>{{ user.username }}</strong></span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="link-btn">Выйти</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>

</html>
